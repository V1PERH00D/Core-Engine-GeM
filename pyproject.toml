[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-engine"
version = "0.1.0"
description = "AI-powered integrated bid compliance verification platform for GeM procurement (SIH Problem Statement 26100)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
  "pydantic>=2.0",
  # Persistence + processing infrastructure milestones:
  # psycopg 3 is the PostgreSQL driver; redis 5+ is the queue/lease client.
  "psycopg[binary]>=3.1",
  "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: opt-in tests requiring live Redis/Postgres (skipped by default)",
]
